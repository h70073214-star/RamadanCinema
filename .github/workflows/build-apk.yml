name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          mkdir -p unpacked
          unzip -q "$ZIP_FILE" -d unpacked

          PROJECT_DIR=$(find unpacked -type f -name "settings.gradle.kts" -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Project files were not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Fix Java 8 to Java 17
        run: |
          find "${PROJECT_DIR}" -type f -name "*.gradle.kts" -exec sed -i 's/VERSION_1_8/VERSION_17/g' {} +
          find "${PROJECT_DIR}" -type f -name "*.gradle.kts" -exec sed -i 's/sourceCompatibility = 1\.8/sourceCompatibility = 17/g' {} +
          find "${PROJECT_DIR}" -type f -name "*.gradle.kts" -exec sed -i 's/targetCompatibility = 1\.8/targetCompatibility = 17/g' {} +

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RamadanCinema-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
